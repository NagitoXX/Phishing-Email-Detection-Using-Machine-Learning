<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phishing Email Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h1>Phishing Email Detection</h1>
    <form method="post" action="{{ url_for('predict') }}">
        <textarea name="email" rows="10" cols="80" placeholder="Paste email text here...">{{ email | default('') }}</textarea><br>
        <button type="submit">Check Email</button>
    </form>
    {% if result %}
        <p>Result: <strong>{{ result }}</strong></p>
    {% endif %}
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    <a href="{{ url_for('awareness') }}">Cybersecurity Awareness Slides</a>
</body>
</html>
